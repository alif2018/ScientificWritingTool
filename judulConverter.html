<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatter - Title Case Converter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-group, .output-group {
            margin-bottom: 20px;
            position: relative;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #34495e;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            resize: vertical;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        button.btn-process {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-bottom: 15px;
            background-color: Transparent;
            background-repeat:no-repeat;
            overflow: hidden;
        }
        button.btn-process:hover {
            background-color: #2980b9;
        }
        .result-container {
            position: relative;
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            min-height: 100px;
        }
        .result-box {
            padding: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit;
            color: #2c3e50;
            font-size: 16px;
        }
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #ffffff;
            border: 1px solid #dfe6e9;
            border-radius: 4px;
            padding: 5px 8px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: #7f8c8d;
            z-index: 10;
        }
        .copy-btn:hover {
            background-color: #f4f7f6;
            border-color: #3498db;
            color: #3498db;
        }
        .copy-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
        .toast {
            visibility: hidden;
            min-width: 150px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 8px;
            position: fixed;
            z-index: 100;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
        }
        .toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

<div class="container">
    <h1>Judul Formatter (Indonesian Title Case)</h1>
    
    <div class="input-group">
        <label for="inputText">Masukkan Teks:</label>
        <textarea id="inputText" placeholder="Contoh: MENGGAGAS DISAIN PENELITIAN QUR'AN-HADIS TEMATIK"></textarea>
    </div>

    <button class="btn-process" onclick="processText()">Format Teks</button>

    <div class="output-group">
        <label>Hasil:</label>
        <div class="result-container">
            <button class="copy-btn" onclick="copyToClipboard()" title="Salin ke Clipboard">
                <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            </button>
            <div id="outputText" class="result-box"></div>
        </div>
    </div>
</div>

<div id="toast" class="toast">Teks disalin!</div>

<script>
function processText() {
    const input = document.getElementById('inputText').value;
    if (!input) {
        document.getElementById('outputText').innerText = "";
        return;
    }

    const lines = input.split('\n');
    const formattedLines = lines.map(line => {
        if (!line.trim()) return "";

        let teks = line.replace(/\s+/g, " ").trim();
        const isFullCap = teks === teks.toUpperCase();
        const isConsecutive3 = /\b[A-Z]{2,}\b\s+\b[A-Z]{2,}\b\s+\b[A-Z]{2,}\b/.test(teks);

        const preposisi = [
            "Akan", "Atas", "Atau", "Bagi", "Bak", "Bahwa", "Buat", "Dalam", "Dan", "Dari", 
            "Daripada", "Demi", "Dengan", "Di", "Hingga", "Ia", "In", "Jika", "Kalau", 
            "Karena", "Ke", "Kecuali", "Kepada", "Lalu", "Lewat", "Maka", "Melalui", 
            "Mengenai", "Oleh", "Pada", "Per", "Sebab", "Sebagai", "Sebagaimana", 
            "Sebanyak", "Sejak", "Selama", "Sambil", "Sampai", "Serta", "Semenjak", 
            "Seperti", "Sesuai", "Setelah", "Tentang", "Terhadap", "Tetapi", "Tiap", 
            "Untuk", "Via", "Yaitu", "Yang"
        ];

        let res = teks.toLowerCase().split(' ').map(word => {
            return word.charAt(0).toUpperCase() + word.slice(1);
        }).join(' ');

        preposisi.forEach(k => {
            const regex = new RegExp(" \\b" + k + "\\b", "gi");
            res = res.replace(regex, " " + k.toLowerCase());
        });

        if (!(isFullCap || isConsecutive3)) {
            const originalWords = teks.split(' ');
            const currentWords = res.split(' ');
            res = currentWords.map((word, index) => {
                const orig = originalWords[index];
                if (orig && orig === orig.toUpperCase() && !/^[0-9\W]+$/.test(orig)) return orig;
                return word;
            }).join(' ');
        }

        res = res.replace(/\b([^aeiouAEIOU\s\d\W]{2,5})\b/g, (match) => match.toUpperCase());

        // LOGIKA BARU:
        // 1. Semua huruf setelah tanda hubung menjadi Kapital (contoh: Undang-Undang)
        res = res.replace(/-([a-z])/g, (match, p1) => "-" + p1.toUpperCase());
        
        // 2. Khusus awalan al- tetap dipaksa kecil (contoh: al-Khairiyah)
        res = res.replace(/\bAl-/gi, "al-");

        // Huruf kecil setelah tanda petik
        res = res.replace(/(['’])([A-Z])/g, (match, p1, p2) => p1 + p2.toLowerCase());

        return res.trim();
    });

    document.getElementById('outputText').innerText = formattedLines.join('\n');
}

function copyToClipboard() {
    const text = document.getElementById('outputText').innerText;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById("toast");
        toast.className = "toast show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    });
}
</script>

</body>
</html>
